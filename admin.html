<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VW Couros | Catálogo</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #fbf7f1;
    --text: #251c1b;
    --muted: #8f7f75;
    --burgundy: #6c140c;
    --gold: #c89508;
    --line: rgba(109, 63, 41, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Manrope", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(200, 149, 8, 0.12), transparent 26%),
      linear-gradient(180deg, #fffdfa 0%, var(--bg) 100%);
    color: var(--text);
  }

  .card {
    width: min(560px, 100%);
    padding: 36px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--line);
    text-align: center;
    box-shadow: 0 26px 70px rgba(43, 23, 18, 0.08);
  }

  .card img {
    width: min(220px, 56%);
    margin: 0 auto 24px;
    display: block;
  }

  h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.4rem, 7vw, 4rem);
    font-weight: 500;
    line-height: 0.94;
    margin-bottom: 14px;
  }

  p {
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .badge {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--burgundy);
    font-size: 0.72rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--text);
    color: #fffaf5;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
  }

  .button:hover,
  .button:focus-visible {
    background: var(--burgundy);
  }
</style>
</head>
<body>
  <main class="card">
    <img src="assets/logo-horizontal.png" alt="VW Couros" />
    <span class="badge">Catálogo estático</span>
    <h1>Sem login, sem painel, sem complicação.</h1>
    <p>
      Esta versão do projeto foi simplificada para divulgação. O site publicado funciona apenas como catálogo,
      com modelos, cores, preços e botão direto para o WhatsApp.
    </p>
    <a class="button" href="index.html">Voltar para o catálogo</a>
  </main>
</body>
</html>
